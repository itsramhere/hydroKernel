version: '3.8'

services:
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: flood-opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
      - "9600:9600"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flood-net

  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: flood-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./configs/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - flood-net
    depends_on:
      opensearch:
        condition: service_healthy

  adot-collector:
    image: public.ecr.aws/aws-observability/aws-otel-collector:latest
    container_name: flood-adot
    command: ["--config=/etc/otel-config.yaml"]
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
    volumes:
      - ./configs/otel-config.yaml:/etc/otel-config.yaml:ro
    networks:
      - flood-net
    depends_on:
      opensearch:
        condition: service_healthy

networks:
  flood-net:
    driver: bridge
